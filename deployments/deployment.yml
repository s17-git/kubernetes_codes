apiVersion: apps/v1

kind: Deployment

metadata:
  name: beekaranta-frontend-deployment

spec:
  template:
    metadata:
      labels:
        app: beekaranta-frontend
        tier: frontend
    spec:
      containers:
      - name: beekaranta-frontend
        image: nginx

  replicas: 3
  selector:
    matchLabels:
      app: beekaranta-frontend
